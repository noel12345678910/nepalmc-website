<!DOCTYPE html>

<body>

    <header>
    <nav class="navbar">

        <a href="index.html">
            <img src="assets/logo.png" class="nav-logo" alt="NepalMC">
        </a>

        <ul id="nav-left">
            <li><a href="index.html" class="active">Home</a></li>
            <li><a href="vote.html">Vote</a></li>
            <li><a href="store.html">Store</a></li>
            <li><a href="staff.html">Staff</a></li>
        </ul>

        <ul id="nav-right">

            <li>
                <a id="ip" href="javascript:void(0)">
                    nepalmc.com

                    <svg class="copy-icon" viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true">

                        <rect width="14" height="14" x="8" y="8" rx="2"></rect>
                        <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path>

                    </svg>

            </li>

            <li>
                <a href="https://discord.gg/BeVw4jVtEf" id="discord">
                    Discord
                </a>
            </li>

        </ul>

    </nav>
    </header>


    <!-- MAIN LOGO -->

    <div id="main-logo">
        <img src="assets/main_img.png" alt="NepalMC">
    </div>


    <!-- SERVER IP -->

    <div id="main-ip">

        <button id="main-ip-button" type="button">

            <span class="ip-info">

                <span id="ip-label">
                    SERVER IP
                </span>

                <code id="main-ip-address">
                    nepalmc.com
                </code>

            </span>

            <span id="copy">

                <svg class="copy-icon" viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true">

                    <rect width="14" height="14" x="8" y="8" rx="2"></rect>
                    <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2-2-2h10c1.1 0 2 .9 2 2"></path>

                </svg>

                <span>Copy</span>

            </span>

    <!-- STORE & DISCORD BUTTONS -->

<div class="main-buttons">

    <a href="store.html" class="main-button store-button">
        Visit the Store
    </a>

    <a href="https://discord.gg/BeVw4jVtEf" class="main-button discord-button">
        Join the Discord
    </a>

</div>

    <footer>
        <p>Made by BISBRO [discord: jucier_pm] &amp; finely tuned by AI</p>
